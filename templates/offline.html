{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1f33">
    <title>Offline · Hangarin</title>
    <link rel="icon" href="{% static 'tasks/img/favicon.svg' %}" type="image/svg+xml">
    <style>
        :root { color-scheme: light; font-family: "Segoe UI", Aptos, system-ui, sans-serif; color: #0b1f33; background: #f4f7fa; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.5rem; }
        main { width: min(100%, 36rem); padding: clamp(1.75rem, 6vw, 3rem); background: #fff; border: 1px solid #d6e0ea; border-radius: 18px; box-shadow: 0 18px 50px rgba(11, 31, 51, .09); }
        .brand { display: flex; align-items: center; gap: .75rem; font-family: "Palatino Linotype", Palatino, Georgia, serif; font-size: 1.45rem; font-weight: 700; }
        .brand img { width: 2.75rem; height: 2.75rem; }
        .orbit { position: relative; height: 5rem; margin: 2.5rem 0 1.25rem; border-top: 2px solid #f5b700; border-radius: 50% 50% 0 0; }
        .orbit::after { content: ""; position: absolute; top: -.5rem; left: 28%; width: .9rem; height: .9rem; border-radius: 50%; background: #f5b700; box-shadow: 0 0 0 .45rem rgba(245, 183, 0, .16); }
        h1 { margin: 0; font-family: "Palatino Linotype", Palatino, Georgia, serif; font-size: clamp(2.3rem, 9vw, 3.5rem); line-height: 1.05; letter-spacing: -.04em; }
        p { margin: 1rem 0 1.75rem; color: #60738a; line-height: 1.6; }
        a { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; padding: .7rem 1.2rem; border-radius: 10px; background: #f5b700; color: #0b1f33; font-weight: 800; text-decoration: none; }
        a:hover { background: #ffc629; }
        a:focus-visible { outline: 3px solid #0b1f33; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <div class="brand"><img src="{% static 'tasks/img/favicon.svg' %}" alt="">Hangarin</div>
        <div class="orbit" aria-hidden="true"></div>
        <h1>You are offline</h1>
        <p>Reconnect to see your tasks and the latest changes in the shared workspace.</p>
        <a href="{% url 'dashboard' %}">Try again</a>
    </main>
</body>
</html>
