<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Request not submitted · Hangarin</title>
    <style>
        :root { color-scheme: light; font-family: system-ui, sans-serif; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7fa; color: #0b1f33; }
        main { box-sizing: border-box; width: min(36rem, 100%); padding: 2rem; }
        .brand { color: #2f6fed; font-weight: 700; letter-spacing: .04em; }
        h1 { margin: .5rem 0 1rem; font-size: clamp(2rem, 8vw, 3rem); line-height: 1.05; }
        p { line-height: 1.6; }
        a { display: inline-block; margin-top: .75rem; color: #fff; background: #2f6fed; padding: .75rem 1rem; border-radius: .5rem; font-weight: 700; text-decoration: none; }
        a:focus-visible { outline: 3px solid #0b1f33; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <p class="brand">Hangarin</p>
        <h1>That request was not submitted</h1>
        <p>For your safety, Hangarin could not confirm that this request came from you. Nothing was changed.</p>
        <p>Return to the site, refresh the page, and try again.</p>
        {% if user.is_authenticated %}
            <a href="{% url 'dashboard' %}">Return to dashboard</a>
        {% else %}
            <a href="{% url 'login' %}">Return to sign in</a>
        {% endif %}
    </main>
</body>
</html>
